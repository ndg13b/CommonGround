[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commonground"
version = "0.2.0"
description = "A knowledge graph as a shared medium for communication between humans and language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nicholas Gray" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
experiments = ["torch>=2.1", "transformers>=4.40", "peft>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
